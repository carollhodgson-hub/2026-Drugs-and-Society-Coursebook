<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blood alcohol concentration and intoxication</title>
  <desc id="desc">A blood drop and rising BAC scale connect alcohol in the bloodstream with increasing impairment, while five surrounding factor cards show amount, pace, body weight and water, food, and individual variation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef8f7"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
    <linearGradient id="scale" x1="0" x2="1"><stop stop-color="#087f78"/><stop offset=".35" stop-color="#f2a900"/><stop offset=".62" stop-color="#d56b35"/><stop offset="1" stop-color="#a33a3a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#153b58" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#153b58">Blood alcohol concentration (BAC)</text>
  <text x="60" y="102" font-family="system-ui,sans-serif" font-size="19" fill="#465f70">The weight of alcohol in a specified volume of blood—not a measure of moral character.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="135" width="500" height="310" rx="22" fill="#fff" stroke="#c9d8df" stroke-width="2"/>
    <path d="M230 188C230 188 137 309 137 361a93 93 0 00186 0c0-52-93-173-93-173z" fill="#a33a3a" opacity=".94"/>
    <circle cx="230" cy="350" r="44" fill="#fff" opacity=".2"/>
    <text x="350" y="210" font-family="system-ui,sans-serif" font-size="21" font-weight="800" fill="#153b58">Alcohol enters blood</text>
    <text x="350" y="246" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">Stomach + small intestine</text>
    <text x="350" y="280" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">→ bloodstream</text>
    <text x="350" y="314" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">→ brain and body</text>
    <text x="350" y="364" font-family="system-ui,sans-serif" font-size="17" font-weight="750" fill="#087f78">BAC rises during absorption</text>
    <text x="350" y="395" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">and falls as alcohol is</text>
    <text x="350" y="421" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">metabolized over time.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="135" width="550" height="310" rx="22" fill="#fff" stroke="#c9d8df" stroke-width="2"/>
    <text x="620" y="180" font-family="system-ui,sans-serif" font-size="21" font-weight="800" fill="#153b58">Impairment begins below the legal limit</text>
    <rect x="625" y="220" width="480" height="38" rx="19" fill="url(#scale)"/>
    <g font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#153b58" text-anchor="middle"><text x="625" y="290">.00</text><text x="745" y="290">.02</text><text x="865" y="290">.05</text><text x="985" y="290">.08</text><text x="1105" y="290">.15</text></g>
    <path d="M985 204v72" stroke="#153b58" stroke-width="4"/>
    <text x="985" y="320" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#153b58" text-anchor="middle">limit in most states</text>
    <text x="625" y="360" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#087f78">Lower BAC</text>
    <text x="1105" y="360" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#a33a3a" text-anchor="end">Greater impairment and risk</text>
    <text x="625" y="403" font-family="system-ui,sans-serif" font-size="17" fill="#465f70">A legal threshold is not a safety threshold.</text>
  </g>
  <g font-family="system-ui,sans-serif" filter="url(#shadow)">
    <g transform="translate(60 485)"><rect width="205" height="130" rx="18" fill="#fff" stroke="#c9d8df"/><circle cx="30" cy="34" r="15" fill="#f2a900"/><text x="58" y="41" font-size="17" font-weight="800" fill="#153b58">Amount</text><text x="20" y="78" font-size="15" fill="#465f70">More pure alcohol</text><text x="20" y="103" font-size="15" fill="#465f70">usually raises BAC.</text></g>
    <g transform="translate(279 485)"><rect width="205" height="130" rx="18" fill="#fff" stroke="#c9d8df"/><circle cx="30" cy="34" r="15" fill="#d56b35"/><text x="58" y="41" font-size="17" font-weight="800" fill="#153b58">Pace + time</text><text x="20" y="78" font-size="15" fill="#465f70">Faster drinking can</text><text x="20" y="103" font-size="15" fill="#465f70">produce a higher peak.</text></g>
    <g transform="translate(498 485)"><rect width="205" height="130" rx="18" fill="#fff" stroke="#c9d8df"/><circle cx="30" cy="34" r="15" fill="#087f78"/><text x="58" y="41" font-size="17" font-weight="800" fill="#153b58">Weight + water</text><text x="20" y="78" font-size="15" fill="#465f70">Distribution differs with</text><text x="20" y="103" font-size="15" fill="#465f70">body size and composition.</text></g>
    <g transform="translate(717 485)"><rect width="205" height="130" rx="18" fill="#fff" stroke="#c9d8df"/><circle cx="30" cy="34" r="15" fill="#7f5aa6"/><text x="58" y="41" font-size="17" font-weight="800" fill="#153b58">Food</text><text x="20" y="78" font-size="15" fill="#465f70">Food can slow absorption;</text><text x="20" y="103" font-size="15" fill="#465f70">it does not create sobriety.</text></g>
    <g transform="translate(936 485)"><rect width="205" height="130" rx="18" fill="#fff" stroke="#c9d8df"/><circle cx="30" cy="34" r="15" fill="#527487"/><text x="58" y="41" font-size="17" font-weight="800" fill="#153b58">Person</text><text x="20" y="78" font-size="15" fill="#465f70">Health, medications, and</text><text x="20" y="103" font-size="15" fill="#465f70">biology change risk.</text></g>
  </g>
</svg>
